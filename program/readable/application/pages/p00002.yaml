- # ====== Dynamic Action: Oblicz ocenę ważoną SK ==============
  id: 173663368923963245
  identification: 
    name: Oblicz ocenę ważoną SK

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: P2_SKUTECZNOSC # 173661371784963225
    column(s): 
    - B_ANKIETA_ODPOWIEDZ

  actions: 
  - # ====== Action: Set Value ===================================
    id: 173663477166963246
    identification: 
      action: Set Value

    settings: 
      set-type: PL/SQL Function Body
      pl/sql-function-body: |
        BEGIN
            -- 1. Warunek: Jeśli nic nie wybrano, zwróć NULL
            IF :B_ANKIETA_ODPOWIEDZ IS NULL THEN
                RETURN NULL;
        
            -- 2. Wyjątek dla pytania nr 10:
            --    "Czy zidentyfikowaliśmy błędy w sposobie przeprowadzenia kontroli..."
            --    Logika odwrócona: TAK = błędy znalezione (źle) -> 0 pkt
            --                      CZĘŚCIOWO -> 0.1 pkt
            --                      NIE / N/A  -> pełna waga (dobrze)
            ELSIF :ID_FK_B_SL_C_PYTANIE = 10 THEN
                IF :B_ANKIETA_ODPOWIEDZ = 'TAK' THEN
                    RETURN 0;
                ELSIF :B_ANKIETA_ODPOWIEDZ = 'CZĘŚCIOWO' THEN
                    RETURN TO_NUMBER(:B_SL_C_PYTANIE_WAGA) * 0.5;
                ELSE
                    -- NIE lub N/A -> pełna waga
                    RETURN TO_NUMBER(:B_SL_C_PYTANIE_WAGA);
                END IF;
        
            -- 3. Warunek standardowy: Jeśli TAK lub N/A -> pełna waga
            ELSIF :B_ANKIETA_ODPOWIEDZ IN ('TAK', 'N/A') THEN
                RETURN TO_NUMBER(:B_SL_C_PYTANIE_WAGA);
        
            -- 4. Warunek standardowy: Jeśli CZĘŚCIOWO -> Waga * 0.5
            ELSIF :B_ANKIETA_ODPOWIEDZ = 'CZĘŚCIOWO' THEN
                RETURN TO_NUMBER(:B_SL_C_PYTANIE_WAGA) * 0.5;
        
            -- 5. Warunek standardowy: W każdym innym przypadku (np. NIE) -> 0
            ELSE
                RETURN 0;
            END IF;
        END;
      items-to-submit: 
      - B_ANKIETA_ODPOWIEDZ
      - B_SL_C_PYTANIE_WAGA
      - ID_FK_B_SL_C_PYTANIE
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - B_ANKIETA_OCENA_WAZONA_LICZ

    execution: 
      sequence: 10
      event: Oblicz ocenę ważoną SK # 173663368923963245
      fire-when-event-result-is: True
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Oblicz ocenę adekwatnosci ===================
    id: 296542931158298120
    identification: 
      name: Oblicz ocenę adekwatnosci
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        DECLARE
            v_dziedzina NUMBER := 1; /*adekwatność*/
        	v_liczba_null 	NUMBER;
        	v_liczba_na 	NUMBER;
            v_suma      	NUMBER;
            v_id_audytu 	NUMBER := :B_APP_ID_AUDYT; -- Zakładam, że ID audytu jest w tej zmiennej
            v_wynik         NUMBER := -1;
        BEGIN
            --0. sprawdzenie, czy wszystkie pola mają ustawioną jakąś wartość
        	SELECT count(1) 
        	INTO v_liczba_null
        	FROM B_ANKIETA a
        	WHERE 
        	  A.ID_FK_B_SL_C_PYTANIE_DZIEDZINA = v_dziedzina
              AND (:B_APP_ID_AUDYT IS NULL OR A.ID_FK_B_AUDYT = :P2_AUDYT_ID)
              AND (:B_APP_ID_KONTROLI IS NULL OR A.ID_FK_B_KONTROLA = :P2_KONTROLA_ID)
              AND a.B_ANKIETA_ODPOWIEDZ IS NULL;
        	IF v_liczba_null>0 THEN 
        	  v_wynik := NULL;
        	END IF;
        	-- 1. CZEŚĆ: Sprawdzenie, czy wszystkie 6 rekordów ma status 'N/A'
            SELECT COUNT(1)
            INTO v_liczba_na
         	FROM B_ANKIETA a
        	WHERE 
        	  A.ID_FK_B_SL_C_PYTANIE_DZIEDZINA = v_dziedzina
              AND (:B_APP_ID_AUDYT IS NULL OR A.ID_FK_B_AUDYT = :P2_AUDYT_ID)
              AND (:B_APP_ID_KONTROLI IS NULL OR A.ID_FK_B_KONTROLA = :P2_KONTROLA_ID)
              AND a.B_ANKIETA_ODPOWIEDZ='N/A';
            -- Jeśli licznik zwróci 6 (lub więcej), zwracamy 'N/A'
            IF v_liczba_na >= 6 THEN
                v_wynik := -1;
            END IF;
            -- 3. CZEŚĆ: Sumowanie kolumny z bazy danych
            SELECT SUM(a.B_ANKIETA_OCENA_WAZONA_LICZ) -- Twoja kolumna F
            INTO v_suma
         	FROM B_ANKIETA a
        	WHERE 
        	  A.ID_FK_B_SL_C_PYTANIE_DZIEDZINA = v_dziedzina
              AND (:B_APP_ID_AUDYT IS NULL OR A.ID_FK_B_AUDYT = :P2_AUDYT_ID)
              AND (:B_APP_ID_KONTROLI IS NULL OR A.ID_FK_B_KONTROLA = :P2_KONTROLA_ID)
              AND a.B_ANKIETA_ODPOWIEDZ IS NOT NULL;
            -- Zabezpieczenie: Jeśli suma jest NULL (brak rekordów), traktuj jak 0
            v_suma := NVL(v_suma, 0);
            -- 4. CZEŚĆ: Ocena końcowa na podstawie sumy
            IF v_suma < 0.25 THEN
                v_wynik := 4;
            ELSIF v_suma < 0.5 THEN
                v_wynik := 3;
            ELSIF v_suma <= 0.75 THEN
                v_wynik := 2;
            ELSE
                v_wynik := 1;
            END IF;
            
            UPDATE B_OCENA a   -- <--- ZMIEŃ NA NAZWĘ TABELI GDZIE TRZYMASZ WYNIK CAŁEGO AUDYTU
            SET a.B_OCENA_LICZONA = v_wynik     -- <--- ZMIEŃ NA NAZWĘ KOLUMNY Z WYNIKIEM
            WHERE 1=1
            AND (:B_APP_ID_AUDYT IS NULL OR A.ID_FK_B_AUDYT = :P2_AUDYT_ID)
            AND (:B_APP_ID_KONTROLI IS NULL OR A.ID_FK_B_KONTROLA = :P2_KONTROLA_ID)
            AND A.B_SL_C_PYTANIE_DZIEDZINA_ID = v_dziedzina; /*ADEKWATNOŚĆ*/   
        END;

    execution: 
      sequence: 30
      event: Oblicz ocenę ważoną SK # 173663368923963245
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

    configuration: 
      build-option: Commented Out # 325892575176729223

