- # ====== Dynamic Action: Oblicz ocenę ważoną AD ==============
  id: 6300944363237720
  identification: 
    name: Oblicz ocenę ważoną AD

  execution: 
    sequence: 40
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Column(s)
    interactive-grid: P2_ADEKWATNOSC # 296543740857298128
    column(s): 
    - B_ANKIETA_ODPOWIEDZ

  actions: 
  - # ====== Action: Set Value ===================================
    id: 7173565104431
    identification: 
      action: Set Value

    settings: 
      set-type: PL/SQL Function Body
      pl/sql-function-body: |
        BEGIN
            -- 1. Warunek: Jeśli nic nie wybrano, zwróć NULL
            IF :B_ANKIETA_ODPOWIEDZ IS NULL THEN
                RETURN NULL;
            
            -- 2. Warunek: Jeśli TAK lub N/A -> Waga * 1
            ELSIF :B_ANKIETA_ODPOWIEDZ IN ('TAK', 'N/A') THEN
                RETURN TO_NUMBER(:B_SL_C_PYTANIE_WAGA);
        
            -- 3. Warunek: Jeśli CZĘŚCIOWO -> Waga * 0.5
            ELSIF :B_ANKIETA_ODPOWIEDZ = 'CZĘŚCIOWO' THEN
                RETURN TO_NUMBER(:B_SL_C_PYTANIE_WAGA) * 0.5;
        
            -- 4. Warunek: W każdym innym przypadku (np. NIE) -> 0
            ELSE
                RETURN 0;
            END IF;
        END;
      items-to-submit: 
      - B_ANKIETA_ODPOWIEDZ
      - B_SL_C_PYTANIE_WAGA
      escape-special-characters: true
      suppress-change-event: false

    affected-elements: 
      selection-type: Column(s)
      column(s): 
      - B_ANKIETA_OCENA_WAZONA_LICZ

    execution: 
      sequence: 10
      event: Oblicz ocenę ważoną AD # 6300944363237720
      fire-when-event-result-is: True
      fire-on-initialization: true
      stop-execution-on-error: true
      wait-for-result: true

