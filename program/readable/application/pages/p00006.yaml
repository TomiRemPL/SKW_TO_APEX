dynamic-actions: 
- # ====== Dynamic Action: DA_Checkbox_Zmiana ==================
  id: 36526904006821716
  identification: 
    name: DA_Checkbox_Zmiana

  execution: 
    sequence: 10
    event-scope: Dynamic
    static-container-(jquery-selector): '#ir-kontrole'
    type: Immediate

  when: 
    event: Change
    selection-type: jQuery Selector
    jquery-selector: input.cb-kontrola

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 36527024042821717
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        (function () {
            var $cb        = $(event.target);
            var idKontroli = $cb.val();
            var zaznaczony = $cb.is(':checked');
            var lista      = apex.item('P6_ZAZNACZONE_ID').getValue();
            var arr        = lista ? lista.split(',').filter(function(v){ return v !== ''; }) : [];
            var idx        = arr.indexOf(idKontroli);
        
            if (zaznaczony && idx < 0) {
                arr.push(idKontroli);
            } else if (!zaznaczony && idx >= 0) {
                arr.splice(idx, 1);
            }
        
            apex.item('P6_ZAZNACZONE_ID').setValue(arr.join(','));
        }());

    execution: 
      sequence: 10
      event: DA_Checkbox_Zmiana # 36526904006821716
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: DA_Po_Odswiezeniu ===================
  id: 36527157833821718
  identification: 
    name: DA_Po_Odswiezeniu

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: After Refresh
    selection-type: Region
    region: Kontrole # 36525723355821704

  actions: 
  - # ====== Action: Przywrócenie stanu ==========================
    id: 36527258855821719
    identification: 
      name: Przywrócenie stanu
      action: Execute JavaScript Code

    settings: 
      code: |2
          (function () {
              // Synchronizacja checkboxa "zaznacz wszystkie"
              var total   = $('#ir-kontrole input.cb-kontrola').length;
              var checked = $('#ir-kontrole input.cb-kontrola:checked').length;
              $('#cb-all').prop('checked', total > 0 && total === checked);
        
              // Znajdź ID nagłówka kolumny "W Audycie" po tekście
              var thId = $('#ir-kontrole th').filter(function () {
                  return $(this).text().trim() === 'W Audycie';
              }).attr('id');
        
              if (!thId) { return; } // kolumna niewidoczna lub ukryta przez użytkownika
        
              // Podświetl wiersze gdzie W AUDYCIE = TAK
              $('#ir-kontrole tbody tr').each(function () {
                  var val = $(this).find('td[headers="' + thId + '"]').text().trim();
                  $(this).toggleClass('juz-w-audycie', val === 'TAK');
              });
          }());

    execution: 
      sequence: 10
      event: DA_Po_Odswiezeniu # 36527157833821718
      fire-when-event-result-is: True
      fire-on-initialization: true

- # ====== Dynamic Action: DA_Zaznacz_Wszystkie ================
  id: 36852100504672680
  identification: 
    name: DA_Zaznacz_Wszystkie

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: jQuery Selector
    jquery-selector: '#cb-all'

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 36852222611672681
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        (function () {
            var zaznaczWszystkie = $(event.target).is(':checked');
            var $ir  = $('#ir-kontrole');
            var listaArr = [];
        
            $ir.find('input.cb-kontrola').each(function () {
                $(this).prop('checked', zaznaczWszystkie);
                $(this).closest('tr').toggleClass('apex-highlighted', zaznaczWszystkie);
                if (zaznaczWszystkie) {
                    listaArr.push($(this).val());
                }
            });
        
            apex.item('P6_ZAZNACZONE_ID').setValue(listaArr.join(','));
        }());

    execution: 
      sequence: 10
      event: DA_Zaznacz_Wszystkie # 36852100504672680
      fire-when-event-result-is: True
      fire-on-initialization: false

processes: 
- # ====== Process: Usun_Kontrole ==============================
  id: 4129569561600013
  identification: 
    name: Usun_Kontrole
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      /*  -- KOD PL/SQL PROCESU "Usun_Kontrole" --*/
      DECLARE
          v_tab  APEX_APPLICATION_GLOBAL.VC_ARR2;
          v_err  VARCHAR2(4000);
      BEGIN
          -- Sprawdz czy cos zaznaczono
          IF :P6_ZAZNACZONE_ID IS NULL OR TRIM(:P6_ZAZNACZONE_ID) = '' THEN
              APEX_ERROR.ADD_ERROR(
                  p_message          => 'Zaznacz przynajmniej jedną kontrolę do usunięcia.',
                  p_display_location => APEX_ERROR.c_inline_in_notification
              );
              RETURN;
          END IF;
          -- Rozdziel liste ID przecinkami i iteruj
          v_tab := APEX_UTIL.STRING_TO_TABLE(:P6_ZAZNACZONE_ID, ',');
          FOR i IN 1 .. v_tab.COUNT LOOP
              IF TRIM(v_tab(i)) IS NOT NULL THEN
                  BEGIN
                      -- Etap 1: Usun ankiete i oceny (BEZ COMMIT)
                      PKG_ANKIETA.USUN_ANKIETE(
                          p_id_audytu   => TO_NUMBER(:P6_ID_AUDYTU),
                          p_id_kontrola => TO_NUMBER(TRIM(v_tab(i)))
                      );
                      -- Etap 2: Usun kontrole z audytu (COMMIT wewnatrz)
                      -- Jesli status audytu != Otwarty, rzuci wyjatek
                      -- i cala operacja (lacznie z USUN_ANKIETE) zostanie wycofana
                      PKG_AUDYT.USUN_KONTROLE(
                          p_id_audytu   => TO_NUMBER(:P6_ID_AUDYTU),
                          p_id_kontrola => TO_NUMBER(TRIM(v_tab(i))),
                          p_uzytkownik  => :APP_USER
                      );
                  EXCEPTION
                      WHEN OTHERS THEN
                          v_err := SQLERRM;
                          -- Pomijamy ORA-20022 (kontrola nie jest w audycie)
                          IF INSTR(v_err, 'ORA-20022') = 0 THEN
                              APEX_ERROR.ADD_ERROR(
                                  p_message          => 'Błąd usuwania: ' || v_err,
                                  p_display_location => APEX_ERROR.c_inline_in_notification
                              );
                              RETURN;
                          END IF;
                  END;
              END IF;
          END LOOP;
          -- Wyczysc zaznaczenie po zapisie
          :P6_ZAZNACZONE_ID := NULL;
      EXCEPTION
          WHEN OTHERS THEN
              v_err := SQLERRM;
              APEX_ERROR.ADD_ERROR(
                  p_message          => 'Błąd podczas usuwania kontroli z audytu: ' || v_err,
                  p_display_location => APEX_ERROR.c_inline_in_notification
              );
      END;

  execution: 
    sequence: 20
    point: After Submit
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: USUN_Z_AUDYTU # 4129436988600012

