    document.querySelector('.a-SearchResults-list').addEventListener('click', function (e) {
        var target = e.target;
        var currentVal ='';
        while (target && target.nodeName !== 'LI') {
            target = target.parentNode;
            if (!target) return;
        }
        var span = target.querySelector('.a-ResultsItem-title');
        if (span) {
            currentVal = apex.item('P10043_PRELIM_USERS').getValue();
            apex.item('P10043_PRELIM_USERS').setValue(currentVal + span.textContent + '; ');
        }
    });  

